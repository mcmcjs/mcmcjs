name: DoodlePPL preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "packages/doodleppl-ui/**"
      - "packages/doodleppl/**"
      - "experimental/bugs-to-graph/**"
      - ".github/workflows/doodleppl-preview.yml"

permissions:
  contents: write
  pull-requests: write

concurrency: doodleppl-preview-${{ github.event.pull_request.number }}

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        if: github.event.action != 'closed'
      - name: Build the editor bundle
        if: github.event.action != 'closed'
        run: |
          pnpm --filter @mcmcjs/doodleppl build
          pnpm --filter doodleppl build
      - name: Assemble the preview pages
        if: github.event.action != 'closed'
        run: |
          mkdir -p preview-site
          cp -r packages/doodleppl-ui/preview/. preview-site/
          cp packages/doodleppl-ui/dist/doodleppl.global.js preview-site/
      - name: Assemble the model-graph page
        if: github.event.action != 'closed'
        working-directory: experimental/bugs-to-graph
        run: |
          node build-bundle.mjs
          curl -sSL -o vendor/stanc.js https://github.com/stan-dev/stanc3/releases/download/v2.39.0/stanc.js
          out=../../preview-site/model-graph
          mkdir -p "$out/dist" "$out/vendor" "$out/fixtures"
          cp viewer.html "$out/index.html"
          cp dist/graph.js "$out/dist/"
          cp vendor/stanc.js vendor/doodleppl.global.js "$out/vendor/"
          cp fixtures/programs.json fixtures/stan-programs.json "$out/fixtures/"
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
