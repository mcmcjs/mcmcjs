name: Site publish

# Publishes the site to https://mcmcjs.github.io/ by pushing the built output to
# the deploy branch of mcmcjs/mcmcjs.github.io, which holds nothing else.
#
# Needs SITE_TOKEN, a token with contents:write on mcmcjs/mcmcjs.github.io
# (deploy keys are disabled for that org). Without it this workflow skips, so a
# fork never fails here.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "report/**"
      - "packages/charts/**"
      - "packages/core/**"
      - "packages/plots/**"
      # A release bumps this, and the site carries the version the installer reads.
      - "packages/cli/package.json"
      - ".github/workflows/site-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: site-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Is the token configured?
        id: key
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -n "$SITE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SITE_TOKEN is not set; skipping the site publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      # At the org root the report app lives under /report/, not /mcmcjs/report/.
      - name: Build the report app
        if: steps.key.outputs.present == 'true'
        run: pnpm build
        env:
          BASE_PATH: /report/

      - name: Build the docs
        if: steps.key.outputs.present == 'true'
        run: |
          npm ci
          npm run build
        working-directory: docs
        env:
          BASE_PATH: /

      - name: Post-process HTML links
        if: steps.key.outputs.present == 'true'
        uses: shravanngoswamii/html-link-action@v1
        with:
          site-dir: docs/dist
          noopener: true
          noreferrer: true
          external-target-blank: true

      - name: Assemble the site
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p site/report
          cp -r docs/dist/. site/
          cp -r report/dist/. site/report/
          ls site

      # bugs-examples/ belongs to bugs-bundles.yml.
      - name: Publish to mcmcjs.github.io
        if: steps.key.outputs.present == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.SITE_TOKEN }}
          repository-name: mcmcjs/mcmcjs.github.io
          branch: deploy
          folder: site
          clean: true
          clean-exclude: |
            bugs-examples
            bugs-examples/**
          commit-message: "publish the site from ${{ github.sha }}"
          single-commit: true
