name: BUGS example bundles

on:
  workflow_dispatch:
    inputs:
      volumes:
        description: "Which volumes to fit"
        type: choice
        default: volume_1
        options: [volume_1, volume_2, volume_3, all]
      example:
        description: "A single example key, e.g. rats. Overrides the volume choice."
        type: string
        default: ""
      juliabugs_ref:
        description: "JuliaBUGS.jl ref holding the examples"
        type: string
        default: main

permissions:
  contents: read

concurrency: bugs-bundles

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Is the token configured?
        id: key
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -n "$SITE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SITE_TOKEN is not set; skipping the publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve the JuliaBUGS ref
        id: ref
        env:
          REF: ${{ inputs.juliabugs_ref }}
        run: |
          repo=https://github.com/TuringLang/JuliaBUGS.jl.git
          sha=$(git ls-remote "$repo" "refs/heads/$REF" "refs/tags/$REF" | cut -f1 | head -1)
          if [ -z "$sha" ]; then
            echo "::error::TuringLang/JuliaBUGS.jl has no branch or tag '$REF'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$REF is $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          repository: TuringLang/JuliaBUGS.jl
          ref: ${{ steps.ref.outputs.sha }}
          path: juliabugs
          persist-credentials: false

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - run: pnpm build

      - name: Emit the examples
        env:
          SELECT: ${{ inputs.example != '' && inputs.example || inputs.volumes }}
        run: |
          script=juliabugs/JuliaBUGS/docs/gen_bundles.jl
          if [ ! -f "$script" ]; then
            echo "::error::gen_bundles.jl is missing at ${{ steps.ref.outputs.sha }}"
            exit 1
          fi
          julia --project=juliabugs/JuliaBUGS -e 'using Pkg; Pkg.instantiate()'
          julia --project=juliabugs/JuliaBUGS "$script" "$GITHUB_WORKSPACE/emitted" "$SELECT"

      - name: Fit and export
        working-directory: emitted
        run: |
          printf '#!/bin/sh\nexec node "%s" "$@"\n' \
            "$GITHUB_WORKSPACE/packages/cli/dist/index.js" > mcmc
          chmod +x mcmc
          export PATH="$PWD:$PATH"
          mcmc setup --engine julia
          sh run.sh || echo "$? example(s) failed to fit" >> "$GITHUB_STEP_SUMMARY"

      - name: Trim and index
        working-directory: emitted/bundles
        run: |
          ls ./*.json >/dev/null 2>&1 || { echo "nothing to publish"; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/trim-bundles.mjs" .

      - name: Publish
        if: steps.key.outputs.present == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.SITE_TOKEN }}
          repository-name: mcmcjs/mcmcjs.github.io
          branch: deploy
          folder: emitted/bundles
          target-folder: bugs-examples
          clean: true
          commit-message: "publish BUGS example bundles from ${{ github.sha }}"

      - name: Summary
        if: always()
        run: |
          cd emitted/bundles 2>/dev/null || exit 0
          {
            echo "| bundle | size |"
            echo "|---|---|"
            for f in ./*.json; do
              [ -e "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
