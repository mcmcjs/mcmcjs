<!doctype html>
<meta charset="utf-8">
<title>BUGS to graph, generated vs hand-drawn</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #fafafa; color: #222; }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #ddd; background: #fff; }
  header select { font: inherit; padding: 4px 8px; }
  header .note { color: #666; }
  main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 12px 16px; }
  section h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #444; }
  section .empty { height: 620px; display: grid; place-items: center; color: #999; border: 1px dashed #ccc; border-radius: 6px; }
  doodle-ppl { display: block; }
  .static { height: 620px; overflow: auto; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
  .static img { display: block; max-width: none; }
</style>

<header>
  <label>Example <select id="pick"></select></label>
  <span class="note" id="meta"></span>
</header>
<main>
  <section><h2>mcmc graph (TypeScript parser, dagre, SVG)</h2><div id="cli"></div></section>
  <section><h2>Widget, opened from the Julia prototype's document</h2><div id="gen"></div></section>
  <section><h2>Hand-drawn (bundled with the widget)</h2><div id="hand"></div></section>
</main>

<script src="https://unpkg.com/doodleppl@0.9.1/dist/doodleppl.global.js" defer></script>
<script>
  const generated = [
    'rats','pumps','dogs','seeds','surgical_simple','surgical_realistic','magnesium','salm','equiv','dyes',
    'stacks','epil','blockers','oxford','lsat','bones','mice','kidney','leuk','leukfr',
    'dugongs','orange_trees','orange_trees_multivariate','biopsies','eyes','hearts','air','cervix','jaws','birats',
    'schools','beetles','alligators','endo','stagnant','asia',
    'eye_tracking','circle','hollow_square','parallelogram','ring','square_minus_circle','hepatitis','hepatitis_me',
    'hips1','hips2','hips3','hips4','pig_weights','bayes_factors',
  ]
  const hand = { rats:'rats', pumps:'pumps', seeds:'seeds', surgical_simple:'surgical', dyes:'dyes',
    blockers:'blockers', salm:'salm', equiv:'equiv', oxford:'oxford', epil:'epil', mice:'mice', kidney:'kidney' }

  const pick = document.getElementById('pick')
  for (const k of generated) {
    const o = document.createElement('option')
    o.value = k; o.textContent = hand[k] ? `${k}  (has hand-drawn)` : k
    pick.append(o)
  }

  // A unique storage key per mount stops the widget reopening a graph it cached
  // in IndexedDB the last time this file was loaded.
  function mount(host, url) {
    host.replaceChildren()
    if (!url) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'no hand-drawn graph'; host.append(d); return }
    const el = document.createElement('doodle-ppl')
    el.setAttribute('local-model', url)
    el.setAttribute('height', '620px')
    el.setAttribute('storage-key', `viewer-${Date.now()}-${Math.random().toString(36).slice(2)}`)
    host.append(el)
  }

  function showStatic(host, url) {
    host.replaceChildren()
    const box = document.createElement('div')
    box.className = 'static'
    const img = document.createElement('img')
    img.src = `${url}?${Date.now()}`
    img.alt = url
    img.onerror = () => { box.replaceChildren(); box.classList.add('empty'); box.textContent = `not rendered: ${url}` }
    box.append(img)
    host.append(box)
  }

  function show(k) {
    location.hash = k
    showStatic(document.getElementById('cli'), `cli/${k}.svg`)
    mount(document.getElementById('gen'), `out/${k}.json`)
    mount(document.getElementById('hand'), hand[k] ? `hand/${hand[k]}.json` : null)
    document.getElementById('meta').textContent = `out/${k}.json`
  }

  pick.addEventListener('change', () => show(pick.value))
  const start = location.hash.slice(1)
  pick.value = generated.includes(start) ? start : 'rats'
  show(pick.value)
</script>
