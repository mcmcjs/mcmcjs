<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Mirrors the embedded widget-mode usage of the JuliaBUGS DoodleWidget page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoodlePPL widget preview</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
    </style>
    <script src="./doodleppl.global.js" defer></script>
  </head>

  <body>
    <h1>Embedded widget mode</h1>
    <p>Default-height widget:</p>
    <doodle-ppl model="pumps"></doodle-ppl>
    <p>Fixed-height widget:</p>
    <doodle-ppl model="seeds" height="500px"></doodle-ppl>
  </body>
</html>
